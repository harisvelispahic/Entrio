server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;

    # Single-page-app fallback.
    # The browser asks nginx for /schedules, but no such file exists on disk —
    # without this, nginx returns 404 and React Router never gets a chance to
    # handle the route. Serve index.html instead and let the app route it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime config must never be cached: it is rewritten on every container
    # start, and a stale copy would point the app at the wrong API.
    location = /env.js {
        # One header only: "expires -1" would add a second, weaker
        # Cache-Control: no-cache alongside this one.
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Fingerprinted build assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
